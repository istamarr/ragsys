#Note: Text rendering on the flyer requires a TTF font. On Windows, [C:\Windows\Fonts\arial.ttf](cci:7://file:///Windows/Fonts/arial.ttf:0:0-0:0) is auto-detected. If the flyer shows layout but no text, set `FLYER_FONT_PATH` to any `.ttf` path. The layout (colored sections, bullet circles, logo/QR placeholders) renders regardless.
